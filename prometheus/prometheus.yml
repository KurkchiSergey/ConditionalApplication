global:
  scrape_interval: 5s        # как часто Prometheus забирает метрики
  evaluation_interval: 5s    # как часто проверяются правила алертов

# Файл с правилами алертов (смонтирован в контейнер, см. docker-compose.yml)
rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: spring-app
    metrics_path: /actuator/prometheus     # endpoint Spring Boot Actuator
    static_configs:
      - targets: ["app:8080"]              # имя сервиса из docker-compose и порт приложения
