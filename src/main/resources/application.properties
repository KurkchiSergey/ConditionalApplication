server.port=8080
netology.profile.dev=true
spring.application.name=memory-app

# --- Actuator ---
# Открываем нужные endpoint-ы по HTTP
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Метка application=memory-app добавляется ко всем метрикам (удобно для фильтрации в Grafana)
management.metrics.tags.application=${spring.application.name}
# Гистограммы времени ответа для HTTP-запросов
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Потребитель памяти ---

memory.consumer.chunk-mb=10
memory.consumer.interval-ms=2000
memory.consumer.max-mb=300
