input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat присылает строку лога целиком в поле message.
  # Разбираем её как JSON: поля level, logger_name, profile, app и др. становятся отдельными полями,
  # а время события (@timestamp) берётся из самого лога.
  json {
    source => "message"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
