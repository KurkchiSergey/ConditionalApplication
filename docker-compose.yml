# Мониторинг Spring Boot приложения: app -> Prometheus -> Grafana.
# Запуск одной командой:  docker compose up -d --build
#   Приложение:  http://localhost:8080/api/ok
#   Prometheus:  http://localhost:9090   (алерты: http://localhost:9090/alerts)
#   Grafana:     http://localhost:3000   (логин admin / пароль admin; дашборд открывается сразу)
services:

  app:
    build: .                      # собирает образ по Dockerfile в корне проекта
    container_name: memory-app
    mem_limit: 768m               # лимит контейнера выше -Xmx512m, чтобы JVM могла работать
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Открывать готовый дашборд сразу после входа
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/my-dashboard.json
      # Просмотр без логина
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Постоянно вызывает методы приложения, чтобы на графиках всегда были данные (200, 404 и 500)
  load-generator:
    image: curlimages/curl:8.8.0
    container_name: load-generator
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://app:8080/actuator/health > /dev/null; do sleep 2; done
        while true; do
          curl -s -o /dev/null http://app:8080/api/ok
          curl -s -o /dev/null http://app:8080/api/ok
          curl -s -o /dev/null http://app:8080/api/not-found
          curl -s -o /dev/null http://app:8080/api/error
          curl -s -o /dev/null http://app:8080/api/stats
          sleep 2
        done
    depends_on:
      - app
